name: Verificar Golzdov

on:
  push:
    branches: [main, 'feat/**']
  pull_request:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Testar RNG, saves, cache e geração de mapas
        run: node --test tests/*.test.cjs
